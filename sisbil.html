<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sistem Bilangan</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow mx-auto" style="max-width: 500px;">
            <div class="card-body p-4">

                <h3 class="text-center mb-4">
                    Kalkulator Sistem Bilangan
                </h3>

                <!-- Input Angka -->
                <label class="form-label">Masukkan Angka</label>
                <input type="text" id="angka"
                       class="form-control mb-3"
                       placeholder="Masukkan angka...">

                <!-- Jenis Bilangan Input -->
                <label class="form-label">Dari Sistem Bilangan</label>
                <select id="dari" class="form-select mb-3">
                    <option value="2">Biner (Basis 2)</option>
                    <option value="8">Oktal (Basis 8)</option>
                    <option value="10" selected>Desimal (Basis 10)</option>
                    <option value="16">Heksadesimal (Basis 16)</option>
                </select>

                <!-- Jenis Bilangan Hasil -->
                <label class="form-label">Ke Sistem Bilangan</label>
                <select id="ke" class="form-select mb-4">
                    <option value="2">Biner (Basis 2)</option>
                    <option value="8">Oktal (Basis 8)</option>
                    <option value="10">Desimal (Basis 10)</option>
                    <option value="16">Heksadesimal (Basis 16)</option>
                </select>

                <!-- Tombol Konversi -->
                <button class="btn btn-primary w-100"
                        onclick="konversikan()">
                    Konversi
                </button>

                <!-- Hasil -->
                <div class="text-center mt-4">
                    <p class="mb-1">Hasil Konversi:</p>
                    <h2 id="hasil" class="text-success fw-bold">
                        -
                    </h2>
                    <p id="pesan" class="text-danger small"></p>
                </div>

            </div>
        </div>
    </div>

    <script>
        function konversikan() {
            let angka = document.getElementById("angka").value.trim();
            let dari = parseInt(document.getElementById("dari").value);
            let ke = parseInt(document.getElementById("ke").value);

            let hasil = document.getElementById("hasil");
            let pesan = document.getElementById("pesan");

            pesan.textContent = "";

            if (angka === "") {
                hasil.textContent = "-";
                pesan.textContent = "Masukkan angka terlebih dahulu!";
                return;
            }

            let desimal = parseInt(angka, dari);

            if (isNaN(desimal) ||
                !Number.isSafeInteger(desimal) ||
                desimal.toString(dari).toLowerCase() !== angka.toLowerCase()) {
                hasil.textContent = "-";
                pesan.textContent = "Angka tidak sesuai dengan sistem bilangan!";
                return;
            }

            hasil.textContent = desimal.toString(ke).toUpperCase();
        }
    </script>

</body>
</html>
